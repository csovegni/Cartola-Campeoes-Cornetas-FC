<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Campeões - Cartola FC</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-gold: #ffd700;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #30363d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 15px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
      width: 100%;
      max-width: 800px;
    }

    .trophy-icon { font-size: 3.5rem; margin-bottom: 10px; }
    h1 { font-size: 2rem; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; }
    p.subtitle { color: var(--text-muted); font-size: 1rem; margin-top: 8px; }

    .gallery-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 35px;
    }

    .year-section {
      background: rgba(22, 27, 34, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }

    .year-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .year-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .year-participants {
      color: var(--text-muted);
      font-size: 1rem;
      font-style: italic;
    }

    .cards-row {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 15px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }
    
    .cards-row::-webkit-scrollbar { height: 8px; }
    .cards-row::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 10px; }

    /* Estrutura Rígida e Padronizada do Card */
    .champion-card {
      background: linear-gradient(145deg, #1c2128, #161b22);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px 15px;
      min-width: 250px;
      max-width: 250px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .badge-container {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      width: 100%;
    }

    .competition-badge {
      display: inline-block;
      background-color: var(--accent-gold);
      color: #000;
      font-weight: 700;
      font-size: 0.72rem;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      max-width: 100%;
    }

    .logo-container {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .team-logo {
      max-width: 85px;
      max-height: 85px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    }

    .champion-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .team-name {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .points-container {
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: auto;
    }

    .points-tag {
      font-size: 0.82rem;
      background-color: rgba(255, 215, 0, 0.1);
      color: var(--accent-gold);
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    .loading, .error-msg { text-align: center; color: var(--text-muted); font-size: 1.1rem; margin-top: 40px; }

    footer { margin-top: 50px; color: var(--text-muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>

  <header>
    <div class="trophy-icon">🏆</div>
    <h1>Galeria de Campeões</h1>
    <p class="subtitle">Histórico de Títulos do Cartola FC desde 2015</p>
  </header>

  <main class="gallery-container" id="galleryContainer">
    <div class="loading">Carregando histórico de campeões...</div>
  </main>

  <footer>
    <p>Liga Cartola FC • Desde 2015</p>
  </footer>

  <script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTcXk8W9C9dh0DW_a-Cqxr--9D2RlsglbiYKqlMobr2zoZAmZ_4CXSeqFcMTjvsWwf7cSNh-e5oamMP/pub?gid=0&single=true&output=csv';

    function getWeight(competicao) {
      const comp = competicao.toLowerCase().trim();
      if (comp.includes('campeonato')) return 1;
      if (comp.includes('medalha')) return 2;
      if (comp.includes('1') || comp.includes('primeiro')) return 3;
      if (comp.includes('2') || comp.includes('segundo')) return 4;
      if (comp.includes('super')) return 5;
      return 99;
    }

    function getFieldValue(item, candidates) {
      const keys = Object.keys(item);
      for (let candidate of candidates) {
        const foundKey = keys.find(k => k.trim().toLowerCase() === candidate.toLowerCase());
        if (foundKey && item[foundKey] !== undefined && item[foundKey] !== null) {
          return item[foundKey].toString().trim();
        }
      }
      return '';
    }

    function processarDados(data) {
      const groupedData = {};

      data.forEach(item => {
        const ano = getFieldValue(item, ['Ano', 'ANO']);
        const competicao = getFieldValue(item, ['Competicao', 'Competição', 'Torneio', 'Titulo', 'Título']);
        const cartoleiro = getFieldValue(item, ['Cartoleiro', 'Nome', 'Campeao', 'Campeão']);
        const time = getFieldValue(item, ['Time', 'Nome do Time', 'Equipe']);
        const pontos = getFieldValue(item, ['Pontos', 'Pontos Totais', 'Pontuação', 'Pontuacao']);
        const logo = getFieldValue(item, ['Logo_URL', 'Logo', 'Escudo', 'Foto', 'URL_Logo']) || 'https://via.placeholder.com/100/ffd700/000000?text=ESCUDO';
        const participantes = getFieldValue(item, ['Participantes', 'Qtd Times', 'Times', 'Participantes_Qtd']);

        if (!ano || !cartoleiro) return;

        if (!groupedData[ano]) {
          groupedData[ano] = {
            ano: ano,
            participantes: participantes,
            campeoes: []
          };
        } else if (participantes && !groupedData[ano].participantes) {
          groupedData[ano].participantes = participantes;
        }

        groupedData[ano].campeoes.push({
          competicao: competicao || 'Campeonato',
          cartoleiro,
          time,
          pontos,
          logo,
          sortWeight: getWeight(competicao)
        });
      });

      const sortedYears = Object.values(groupedData).sort((a, b) => parseInt(b.ano) - parseInt(a.ano));

      renderizarGaleria(sortedYears);
    }

    function renderizarGaleria(anosData) {
      const container = document.getElementById('galleryContainer');
      container.innerHTML = '';

      if (anosData.length === 0) {
        container.innerHTML = '<div class="error-msg">Nenhum dado encontrado. Verifique a planilha.</div>';
        return;
      }

      anosData.forEach(anoGroup => {
        anoGroup.campeoes.sort((a, b) => a.sortWeight - b.sortWeight);

        const section = document.createElement('div');
        section.className = 'year-section';

        const partText = anoGroup.participantes ? `<span class="year-participants">(${anoGroup.participantes})</span>` : '';
        
        let cardsHtml = '';
        anoGroup.campeoes.forEach(camp => {
          cardsHtml += `
            <div class="champion-card">
              <div class="badge-container">
                <span class="competition-badge">${camp.competicao}</span>
              </div>
              <div class="logo-container">
                <img src="${camp.logo}" alt="Escudo" class="team-logo" onerror="this.src='https://via.placeholder.com/100/ffd700/000000?text=ESCUDO'">
              </div>
              <div class="champion-name">${camp.cartoleiro}</div>
              <div class="team-name">${camp.time}</div>
              <div class="points-container">
                ${camp.pontos ? `<span class="points-tag">${camp.pontos}</span>` : ''}
              </div>
            </div>
          `;
        });

        section.innerHTML = `
          <div class="year-header">
            <div class="year-title">${anoGroup.ano}</div>
            ${partText}
          </div>
          <div class="cards-row">
            ${cardsHtml}
          </div>
        `;

        container.appendChild(section);
      });
    }

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        processarDados(results.data);
      },
      error: function(err) {
        document.getElementById('galleryContainer').innerHTML = 
          '<div class="error-msg">Erro ao conectar com a planilha.</div>';
      }
    });
  </script>
</body>
</html>
